<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hildan AI</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-one-dark.min.css" rel="stylesheet" />

  <style>
    :root {
      --primary: #00ff88;
      --primary-dark: #00cc70;
      --bg: #0a0e17;
      --sidebar-bg: rgba(15, 20, 35, 0.95);
      --card-bg: rgba(20, 25, 45, 0.7);
      --text: #e0e0e0;
      --text-muted: #a0a0c0;
      --active: rgba(0, 255, 136, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f1624 0%, #1a0b2e 100%);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: rgba(20, 25, 45, 0.9);
      backdrop-filter: blur(15px);
      padding: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0, 255, 136, 0.2);
      z-index: 10;
    }

    #menu-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.5rem;
    }

    header h1 {
      font-size: clamp(1.2rem, 4vw, 1.6rem);
      font-weight: 700;
    }

    #app-container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    #sidebar {
      width: 280px;
      background: var(--sidebar-bg);
      backdrop-filter: blur(15px);
      border-right: 1px solid rgba(0, 255, 136, 0.2);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease;
    }

    #new-chat-btn {
      padding: 1rem;
      background: var(--primary);
      color: #000;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      margin: 1rem;
      border-radius: 12px;
      transition: 0.3s;
    }

    #new-chat-btn:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }

    #history-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 1rem 1rem;
    }

    .history-item {
      padding: 14px 16px;
      border-radius: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: 0.3s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 0.95rem;
    }

    .history-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .history-item.active {
      background: var(--active);
      border-left: 4px solid var(--primary);
    }

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 85%;
      padding: 14px 18px;
      border-radius: 20px;
      line-height: 1.6;
      word-wrap: break-word;
      white-space: pre-wrap;
      animation: fadeIn 0.4s ease-out;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      font-size: clamp(0.9rem, 2.5vw, 1rem);
    }

    .user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #000;
      border-bottom-right-radius: 6px;
    }

    .bot {
      align-self: flex-start;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 255, 136, 0.2);
      border-bottom-left-radius: 6px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .code-block {
      position: relative;
      background: #0e1420;
      border-radius: 12px;
      margin: 12px 0;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .code-block pre {
      margin: 0 !important;
      padding: 20px !important;
      overflow-x: auto;
    }

    .code-block code {
      font-family: 'Fira Code', 'Courier New', monospace !important;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .copy-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 255, 136, 0.2);
      color: var(--primary);
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      z-index: 10;
    }

    .copy-btn:hover {
      background: var(--primary);
      color: #000;
    }

    .copy-feedback {
      position: absolute;
      top: 12px;
      right: 90px;
      background: var(--primary);
      color: #000;
      padding: 8px 14px;
      border-radius: 8px;
      opacity: 0;
      transition: opacity 0.3s;
      font-weight: bold;
      z-index: 10;
    }

    .typing {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-style: italic;
    }

    .typing span {
      width: 8px;
      height: 8px;
      background: var(--primary);
      border-radius: 50%;
      animation: typingDots 1.4s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typingDots {

      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: 0.4;
      }

      30% {
        transform: translateY(-10px);
        opacity: 1;
      }
    }

    #input-area {
      display: flex;
      padding: 1rem;
      background: rgba(15, 20, 35, 0.9);
      backdrop-filter: blur(15px);
      gap: 12px;
      border-top: 1px solid rgba(0, 255, 136, 0.2);
    }

    #prompt {
      flex: 1;
      padding: 16px 20px;
      border: none;
      border-radius: 30px;
      background: rgba(25, 35, 60, 0.7);
      color: #fff;
      font-size: clamp(0.95rem, 2.5vw, 1rem);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      outline: none;
      transition: 0.3s;
      resize: none;
      overflow-y: auto;
      min-height: 52px;
      max-height: 150px;
      line-height: 1.5;
    }

    #prompt:focus {
      background: rgba(35, 45, 80, 0.8);
      box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.4);
    }

    #send-btn {
      padding: 0 24px;
      background: var(--primary);
      color: #000;
      border: none;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
      transition: 0.3s;
    }

    #send-btn:hover {
      background: var(--primary-dark);
      transform: scale(1.05);
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      transform: scale(0);
      animation: rippleAnim 0.6s ease-out;
      pointer-events: none;
    }

    @keyframes rippleAnim {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

    footer {
      text-align: center;
      padding: 0.8rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      background: rgba(10, 15, 25, 0.8);
    }

    footer a {
      color: var(--primary);
      text-decoration: none;
    }

    @media (max-width: 768px) {
      #menu-btn {
        display: block;
      }

      #sidebar {
        position: fixed;
        left: 0;
        top: 0;
        height: 100%;
        width: 80%;
        z-index: 1000;
        transform: translateX(-100%);
      }

      #sidebar.open {
        transform: translateX(0);
      }

      header h1 {
        font-size: 1.4rem;
      }

      .message {
        max-width: 95%;
        padding: 12px 16px;
        font-size: 0.95rem;
      }

      #chat-container {
        padding: 1rem;
        gap: 1rem;
      }

      #input-area {
        padding: 0.8rem;
        gap: 10px;
      }

      #prompt {
        padding: 14px 18px;
        font-size: 1.05rem;
      }

      #send-btn {
        padding: 0 20px;
      }

      .code-block pre {
        padding: 16px !important;
      }

      .code-block code {
        font-size: 0.9rem;
      }
    }
  </style>
</head>

<body>

  <header>
    <button id="menu-btn"><i class="fas fa-bars"></i></button>
    <h1>HILDAN AI</h1>
    <div></div>
  </header>

  <div id="app-container">
    <div id="sidebar">
      <div id="new-chat-btn"><i class="fas fa-plus"></i> Chat Baru</div>
      <div id="history-list"></div>
    </div>

    <div id="main">
      <div id="chat-container"></div>
      <div id="input-area">
        <textarea id="prompt" placeholder="Ceritain apa aja ke Hildan AI..." autocomplete="off" rows="1"></textarea>
        <button id="send-btn"><i class="fas fa-paper-plane"></i> Kirim</button>
      </div>
    </div>
  </div>

  <footer>
    by <a href="https://github.com/hildan-anugrah/groq-rest-api" target="_blank">hildan-anugrah</a> • Hildan AI - SI
    Semester 3 🤙
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const chatContainer = document.getElementById('chat-container');
      const promptInput = document.getElementById('prompt');
      const sendBtn = document.getElementById('send-btn');
      const newChatBtn = document.getElementById('new-chat-btn');
      const historyList = document.getElementById('history-list');
      const sidebar = document.getElementById('sidebar');
      const menuBtn = document.getElementById('menu-btn');

      const STORAGE_KEY = 'hildan_ai_chats';
      const MAX_CHATS = 30;
      const MAX_MESSAGES = 200;

      let chats = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      let currentChatId = null;

      function optimizeStorage() {
        if (chats.length > MAX_CHATS) chats = chats.slice(0, MAX_CHATS);
        chats.forEach(chat => {
          if (chat.messages.length > MAX_MESSAGES) chat.messages = chat.messages.slice(-MAX_MESSAGES);
        });
      }

      function saveChats() {
        optimizeStorage();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
        renderHistory();
      }

      function createNewChat() {
        const newChat = { id: Date.now(), title: "Chat Baru", messages: [] };
        chats.unshift(newChat);
        saveChats();
        loadChat(newChat.id);
        if (window.innerWidth <= 768) sidebar.classList.remove('open');
      }

      function loadChat(id) {
        if (currentChatId === id) return;

        currentChatId = id;
        const chat = chats.find(c => c.id === id);
        if (!chat) return;

        chatContainer.innerHTML = '';

        chat.messages.forEach(msg => {
          if (msg.sender === 'user') tambahPesanUser(msg.text);
          else tambahPesanBot(msg.text);
        });

        if (chat.messages.length === 0) {
          const greeting = document.createElement('div');
          greeting.className = 'message bot';
          greeting.innerHTML = "Yo bro/sis! 👋 Gue Hildan AI, mahasiswa SI semester 3 yang lagi excited belajar coding & AI nih 🤖<br>Ada yang bisa gue bantu hari ini? Cerita aja apa aja, gue dengerin kok! 😊";
          chatContainer.appendChild(greeting);
        }

        renderHistory();
        promptInput.focus();
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }

      function renderHistory() {
        historyList.innerHTML = '';
        chats.forEach(chat => {
          const item = document.createElement('div');
          item.className = 'history-item' + (chat.id === currentChatId ? ' active' : '');

          let title = "Chat Baru";
          if (chat.messages.length > 0) {
            const firstUser = chat.messages.find(m => m.sender === 'user');
            if (firstUser) title = firstUser.text.substring(0, 35) + (firstUser.text.length > 35 ? '...' : '');
          }
          item.textContent = title;
          item.onclick = () => {
            loadChat(chat.id);
            if (window.innerWidth <= 768) sidebar.classList.remove('open');
          };
          historyList.appendChild(item);
        });
      }

      function saveMessage(sender, text) {
        if (!currentChatId) return;
        const chat = chats.find(c => c.id === currentChatId);
        if (chat) {
          chat.messages.push({ sender, text });
          if (chat.messages.length === 1 && sender === 'user') {
            chat.title = text.substring(0, 35) + (text.length > 35 ? '...' : '');
          }
          saveChats();
        }
      }

      function tambahPesanUser(text) {
        const div = document.createElement('div');
        div.className = 'message user';
        div.textContent = text;
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }

      function tambahPesanBot(text) {
        const div = document.createElement('div');
        div.className = 'message bot';

        let content = '';
        const codeRegex = /```(\w+)?\n([\s\S]*?)```/g;
        let lastIndex = 0, match;

        while ((match = codeRegex.exec(text)) !== null) {
          if (match.index > lastIndex) {
            content += escapeHtml(text.slice(lastIndex, match.index)).replace(/\n/g, '<br>') + '<br><br>';
          }

          const lang = match[1] ? match[1].toLowerCase() : 'javascript';
          const rawCode = match[2];

          const highlighted = Prism.highlight(rawCode, Prism.languages[lang] || Prism.languages.markup, lang);

          content += `
            <div class="code-block">
              <pre><code class="language-${lang}">${highlighted}</code></pre>
              <button class="copy-btn">Copy</button>
              <span class="copy-feedback">Copied!</span>
            </div><br>`;

          lastIndex = codeRegex.lastIndex;
        }

        if (lastIndex < text.length) {
          content += escapeHtml(text.slice(lastIndex)).replace(/\n/g, '<br>');
        }

        if (!content.includes('code-block')) {
          content = escapeHtml(text).replace(/\n/g, '<br>');
        }

        div.innerHTML = content;
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        div.querySelectorAll('.copy-btn').forEach(btn => {
          btn.onclick = async () => {
            const codeText = btn.previousElementSibling.querySelector('code').textContent;
            await navigator.clipboard.writeText(codeText);
            btn.nextElementSibling.style.opacity = '1';
            setTimeout(() => btn.nextElementSibling.style.opacity = '0', 1500);
          };
        });
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      async function kirimPesan() {
        const text = promptInput.value.trim();
        if (!text) return;

        // Reset textarea height after sending
        promptInput.style.height = 'auto';

        tambahPesanUser(text);
        saveMessage('user', text);
        promptInput.value = '';
        sendBtn.disabled = true;

        const typing = document.createElement('div');
        typing.className = 'message bot typing';
        typing.innerHTML = 'Hildan AI lagi mikir nih <span></span><span></span><span></span>';
        chatContainer.appendChild(typing);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        try {
          const res = await fetch('http://localhost:3000/generate-text', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: text })
          });
          if (!res.ok) throw new Error();
          const data = await res.json();
          const jawaban = data.result || "Waduh, Hildan AI lagi bingung nih 😅";
          if (typing.parentNode) chatContainer.removeChild(typing);
          tambahPesanBot(jawaban);
          saveMessage('bot', jawaban);
        } catch (err) {
          if (typing.parentNode) chatContainer.removeChild(typing);
          tambahPesanBot("Server lagi down nih bro/sis 😭 Coba lagi bentar ya, Hildan AI tetep nunggu kok! ❤️");
        } finally {
          sendBtn.disabled = false;
          promptInput.focus();
        }
      }

      // DEVICE DETECTION untuk Enter key behavior
      function isMobileDevice() {
        const userAgent = navigator.userAgent.toLowerCase();
        const isMobileUA = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(userAgent);
        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        const isSmallScreen = window.innerWidth <= 768;
        return (isMobileUA || isTouchDevice) && isSmallScreen;
      }

      // AUTO-RESIZE TEXTAREA
      function autoResizeTextarea() {
        promptInput.style.height = 'auto';
        promptInput.style.height = Math.min(promptInput.scrollHeight, 150) + 'px';
      }

      promptInput.addEventListener('input', autoResizeTextarea);

      // ENTER KEY: Berbeda untuk Desktop vs Mobile
      promptInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          const isMobile = isMobileDevice();

          if (isMobile) {
            // MOBILE: Enter = baris baru (tidak kirim pesan)
            // User harus tekan tombol Kirim untuk mengirim
            // Tidak perlu preventDefault, biarkan behavior default
          } else {
            // DESKTOP/LAPTOP: Enter = kirim pesan, Shift+Enter = baris baru
            if (!e.shiftKey) {
              e.preventDefault();
              kirimPesan();
            }
          }
        }
      });

      newChatBtn.onclick = createNewChat;
      menuBtn.onclick = () => sidebar.classList.toggle('open');

      sendBtn.onclick = (e) => {
        const rect = sendBtn.getBoundingClientRect();
        const ripple = document.createElement('span');
        ripple.classList.add('ripple');
        ripple.style.left = (e.clientX - rect.left) + 'px';
        ripple.style.top = (e.clientY - rect.top) + 'px';
        sendBtn.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
        kirimPesan();
      };

      optimizeStorage();
      if (chats.length === 0) createNewChat();
      else loadChat(chats[0].id);
    });
  </script>
</body>

</html>
