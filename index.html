<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hildan AI</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-one-dark.min.css" rel="stylesheet" />

  <!-- Open Graph -->
  <meta property="og:title" content="Hildan AI - Chatbot Keren Indonesia" />
  <meta property="og:description" content="Chat apa aja sama Hildan AI! Santai, lucu, dan siap bantu. Coba yuk~" />
  <meta property="og:image" content="https://via.placeholder.com/1200x630/000000/00D4AA?text=Hildan+AI" />
  <meta property="og:url" content="https://hildan-ai.vercel.app" />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#00D4AA" />

  <style>
    :root {
      --primary: #00D4AA;
      --primary-dark: #00B894;
      --primary-light: #33E8C0;
      --bg: #000000;
      --sidebar-bg: rgba(10, 10, 10, 0.95);
      --card-bg: rgba(20, 25, 30, 0.8);
      --text: #e0e0e0;
      --text-muted: #94a3b8;
      --active: rgba(0, 212, 170, 0.15);
      --border-accent: rgba(0, 212, 170, 0.2);
      --overlay: rgba(0, 0, 0, 0.7);
      --danger: #e74c3c;
      --danger-soft: #ff6b6b;
    }

    [data-theme="light"] {
      --bg: #ffffff;
      --sidebar-bg: rgba(255, 255, 255, 0.95);
      --card-bg: rgba(240, 245, 250, 0.9);
      --text: #1e1e1e;
      --text-muted: #64748b;
      --active: rgba(0, 212, 170, 0.1);
      --border-accent: rgba(0, 212, 170, 0.3);
      --overlay: rgba(0, 0, 0, 0.5);
      --danger-soft: #ff4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      opacity: 0;
      animation: fadeInBody 1.2s ease-out forwards;
    }

    @keyframes fadeInBody { to { opacity: 1; } }

    header {
      background: rgba(15, 15, 15, 0.9);
      backdrop-filter: blur(20px);
      padding: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 10;
    }

    [data-theme="light"] header {
      background: rgba(255, 255, 255, 0.9);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }

    #menu-btn { background: none; border: none; color: var(--text); font-size: 1.5rem; cursor: pointer; padding: 0.5rem; border-radius: 8px; }
    #menu-btn:hover { background: rgba(255, 255, 255, 0.1); }

    header h1 { font-size: clamp(1.3rem, 3vw, 1.8rem); font-weight: 600; color: var(--primary); }

    /* ... (CSS lain sama seperti sebelumnya, hemat tempat) ... */

    .regenerate-btn {
      background: rgba(0, 212, 170, 0.2);
      color: var(--primary);
      border: 1.5px solid var(--primary);
      padding: 10px 20px;
      border-radius: 14px;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(0, 212, 170, 0.3);
      transition: all 0.4s ease;
    }

    .regenerate-btn:hover {
      background: var(--primary);
      color: #000;
      transform: translateY(-3px) scale(1.03);
    }

    .edit-controls .save {
      background: var(--primary);
      color: #000;
      padding: 12px 28px;
      border-radius: 30px;
      font-weight: 600;
    }

    .edit-controls .save:hover {
      background: var(--primary-light);
      transform: translateY(-2px) scale(1.05);
    }

    .edit-controls .cancel {
      background: transparent;
      color: var(--danger-soft);
      border: 1.5px solid var(--danger-soft);
      padding: 12px 28px;
      border-radius: 30px;
      font-weight: 600;
    }

    .edit-controls .cancel:hover {
      background: var(--danger-soft);
      color: #fff;
    }

    .edit-controls {
      margin-top: 12px;
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    /* ... sisa CSS sama ... */
  </style>
</head>

<body>
  <!-- HTML structure sama seperti yang kamu kasih -->

  <script>
    // ... init dan function lain sama ...

    function startEdit(wrapper) {
      const messageDiv = wrapper.querySelector('.message');
      const originalText = messageDiv.dataset.originalText || messageDiv.textContent.trim();

      const textarea = document.createElement('textarea');
      textarea.value = originalText;
      textarea.style.width = '100%';
      textarea.style.minHeight = '80px';
      textarea.style.padding = '12px';
      textarea.style.borderRadius = '12px';
      textarea.style.border = '1px solid var(--primary)';
      textarea.style.background = 'var(--card-bg)';
      textarea.style.color = 'var(--text)';
      textarea.style.fontSize = '1rem';
      textarea.style.lineHeight = '1.5';

      const controls = document.createElement('div');
      controls.className = 'edit-controls';
      controls.innerHTML = `
        <button class="cancel">Batal</button>
        <button class="save">Kirim Ulang</button>
      `;

      messageDiv.innerHTML = '';
      messageDiv.appendChild(textarea);
      messageDiv.appendChild(controls);

      textarea.focus();

      controls.querySelector('.cancel').onclick = () => {
        messageDiv.innerHTML = originalText;
        messageDiv.dataset.originalText = originalText;
      };

      controls.querySelector('.save').onclick = () => {
        const newText = textarea.value.trim();
        if (newText) {
          const escaped = escapeHtml(newText);
          messageDiv.innerHTML = escaped;
          messageDiv.dataset.originalText = escaped;

          const chat = chats.find(c => c.id === currentChatId);
          const msg = chat.messages.find(m => m.id == parseInt(wrapper.dataset.msgId));
          if (msg) msg.text = newText;

          regenerateAfterEdit(wrapper);
        } else {
          messageDiv.innerHTML = originalText;
          messageDiv.dataset.originalText = originalText;
        }
      };
    }

    // ... sisa script sama seperti kode kamu yang sudah benar ...

    async function sendPrompt(promptText) {
      if (!promptText || sendBtn.disabled) return;

      const typing = document.createElement('div');
      typing.className = 'message-wrapper';
      typing.id = 'typing-indicator';
      typing.innerHTML = `
        <div class="avatar"><i class="fas fa-robot"></i></div>
        <div class="message bot typing">Sedang mengetik... <span></span><span></span><span></span></div>
      `;
      chatContainer.appendChild(typing);
      appendMessageAndScroll();

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000);

        const res = await fetch('https://back-ai-delta.vercel.app/generate-text', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: promptText }),
          signal: controller.signal
        });

        clearTimeout(timeoutId);
        const data = await res.json();
        typing.remove();

        if (res.ok) {
          const jawaban = data.result || data.message || "Maaf, tidak ada jawaban.";
          addBotMessage(jawaban);
          saveMessage('bot', jawaban);
        } else {
          addBotMessage("Error server: " + (data.error || res.status));
        }
      } catch (err) {
        typing.remove();
        addBotMessage("Server down atau timeout. Coba lagi nanti.");
      } finally {
        sendBtn.disabled = false;
        promptInput.focus();
      }
    }
  </script>
</body>

</html>
