<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hildan AI</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-one-dark.min.css" rel="stylesheet" />

  <style>
    :root {
      --primary: #00D4AA;
      --primary-dark: #00B894;
      --primary-light: #33E8C0;
      --bg: #000000;
      --sidebar-bg: rgba(10, 10, 10, 0.95);
      --card-bg: rgba(20, 25, 30, 0.8);
      --text: #e0e0e0;
      --text-muted: #94a3b8;
      --active: rgba(0, 212, 170, 0.15);
      --border-accent: rgba(0, 212, 170, 0.2);
      --overlay: rgba(0, 0, 0, 0.7);
      --danger: #e74c3c;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Google Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      opacity: 0;
      animation: fadeInBody 1.2s ease-out forwards;
    }

    @keyframes fadeInBody {
      to { opacity: 1; }
    }

    header {
      background: rgba(15, 15, 15, 0.9);
      backdrop-filter: blur(20px);
      padding: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 10;
    }

    #menu-btn {
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 8px;
      transition: background 0.2s;
    }

    #menu-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    header h1 {
      font-size: clamp(1.3rem, 3vw, 1.8rem);
      font-weight: 600;
      color: var(--primary);
    }

    #app-container {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    #sidebar-overlay {
      position: fixed;
      inset: 0;
      background: var(--overlay);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s;
      z-index: 998;
    }

    #sidebar-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    #sidebar {
      width: 280px;
      max-width: 90vw;
      background: var(--sidebar-bg);
      backdrop-filter: blur(20px);
      border-right: 1px solid var(--border-accent);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 999;
      position: relative;
    }

    #sidebar-close {
      display: none;
      position: absolute;
      top: 12px;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.8rem;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      transition: background 0.2s;
    }

    #sidebar-close:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    #new-chat-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      background: transparent;
      border: 1px solid var(--primary);
      color: var(--primary);
      font-weight: 600;
      cursor: pointer;
      margin: 16px;
      border-radius: 30px;
      transition: all 0.3s;
    }

    #new-chat-btn:hover {
      background: var(--active);
      transform: translateY(-2px);
    }

    #settings-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      background: transparent;
      border: 1px solid var(--text-muted);
      color: var(--text-muted);
      font-weight: 600;
      cursor: pointer;
      margin: 8px 16px 16px;
      border-radius: 30px;
      transition: all 0.3s;
    }

    #settings-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--active);
    }

    .settings-menu {
      display: none;
      flex-direction: column;
      padding: 0 16px 16px;
      gap: 8px;
    }

    .settings-menu.open {
      display: flex;
    }

    .settings-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: 0.3s;
    }

    .settings-item:hover {
      background: var(--active);
    }

    .settings-item.danger {
      color: var(--danger);
    }

    .settings-item.danger:hover {
      background: rgba(231, 76, 60, 0.15);
    }

    #history-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-radius: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: 0.3s;
      font-size: 0.95rem;
    }

    .history-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .history-item.active {
      background: var(--active);
      border-left: 4px solid var(--primary);
    }

    .history-title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .delete-btn {
      color: var(--text-muted);
      font-size: 1.1rem;
      padding: 8px;
      border-radius: 8px;
      opacity: 0;
      transition: opacity 0.2s, color 0.2s;
    }

    .history-item:hover .delete-btn {
      opacity: 1;
    }

    .delete-btn:hover {
      color: var(--danger);
      background: rgba(231, 76, 60, 0.15);
    }

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      scroll-behavior: smooth;
      position: relative;
    }

    .message {
      max-width: 80%;
      padding: 16px 20px;
      border-radius: 24px;
      line-height: 1.6;
      word-wrap: break-word;
      white-space: pre-wrap;
      animation: fadeInMessage 0.6s ease-out;
      font-size: clamp(0.95rem, 2vw, 1.05rem);
      opacity: 0;
      animation-fill-mode: forwards;
    }

    @keyframes fadeInMessage {
      to { opacity: 1; transform: translateY(0); }
      from { opacity: 0; transform: translateY(20px); }
    }

    .user {
      align-self: flex-end;
      background: var(--primary);
      color: #000000;
      border-bottom-right-radius: 8px;
    }

    .bot {
      align-self: flex-start;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom-left-radius: 8px;
      color: var(--text);
    }

    .code-block {
      position: relative;
      background: #0a0f0f;
      border-radius: 16px;
      margin: 16px 0;
      overflow: hidden;
      border: 1px solid rgba(0, 212, 170, 0.2);
    }

    .code-block pre {
      margin: 0 !important;
      padding: 20px !important;
      overflow-x: auto;
    }

    .code-block code {
      font-family: 'Fira Code', monospace !important;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .copy-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 212, 170, 0.2);
      color: var(--primary);
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .copy-btn:hover {
      background: var(--primary);
      color: #000;
    }

    .copy-feedback {
      position: absolute;
      top: 12px;
      right: 90px;
      background: var(--primary);
      color: #000;
      padding: 8px 14px;
      border-radius: 8px;
      opacity: 0;
      transition: opacity 0.3s;
      font-weight: bold;
    }

    .typing {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
    }

    .typing span {
      width: 8px;
      height: 8px;
      background: var(--primary-light);
      border-radius: 50%;
      animation: typingDots 1.4s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingDots {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-10px); opacity: 1; }
    }

    #input-area {
      display: flex;
      padding: 1rem;
      background: rgba(10, 10, 10, 0.9);
      backdrop-filter: blur(20px);
      gap: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    #prompt {
      flex: 1;
      padding: 16px 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;
      background: rgba(25, 30, 40, 0.8);
      color: #fff;
      font-size: clamp(0.95rem, 2vw, 1rem);
      outline: none;
      transition: 0.3s;
      resize: none;
      overflow-y: auto;
      min-height: 56px;
      max-height: 160px;
      line-height: 1.5;
    }

    #prompt:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 212, 170, 0.3);
    }

    #send-btn {
      padding: 0 24px;
      background: var(--primary);
      color: #000;
      border: none;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: 0.3s;
    }

    #send-btn:hover {
      background: var(--primary-dark);
      transform: scale(1.05);
    }

    #back-to-bottom {
      position: fixed;
      bottom: 100px;
      right: 20px;
      background: rgba(0, 212, 170, 0.9);
      color: #000;
      border: none;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      z-index: 100;
    }

    #back-to-bottom.show {
      opacity: 1;
      visibility: visible;
    }

    #back-to-bottom:hover {
      background: var(--primary);
      transform: scale(1.1);
    }

    footer {
      text-align: center;
      padding: 0.8rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.8);
    }

    footer a {
      color: var(--primary);
      text-decoration: none;
    }

    /* Hidden input for import */
    #import-input {
      display: none;
    }

    @media (max-width: 1023px) {
      #menu-btn { display: block; }
      #sidebar { position: fixed; left: 0; top: 0; height: 100%; transform: translateX(-100%); box-shadow: 4px 0 20px rgba(0, 0, 0, 0.5); }
      #sidebar.open { transform: translateX(0); }
      #sidebar-close { display: block; }
    }

    @media (min-width: 1024px) {
      #menu-btn { display: none; }
      #sidebar { transform: translateX(0) !important; position: static; box-shadow: none; }
      #sidebar-close, #sidebar-overlay { display: none !important; }
      .message { max-width: 75%; }
      #chat-container { padding: 2.5rem 2rem; }
    }

    @media (max-width: 768px) {
      .message { max-width: 92%; }
      #chat-container { padding: 1.5rem 1rem; }
      #back-to-bottom { bottom: 90px; right: 15px; }
    }
  </style>
</head>

<body>
  <header>
    <button id="menu-btn"><i class="fas fa-bars"></i></button>
    <h1>HILDAN AI</h1>
    <div></div>
  </header>

  <div id="app-container">
    <div id="sidebar-overlay"></div>

    <div id="sidebar">
      <button id="sidebar-close">&times;</button>
      <div id="new-chat-btn"><i class="fas fa-plus"></i> Chat Baru</div>
      <div id="history-list"></div>
      <div id="settings-btn"><i class="fas fa-cog"></i> Settings</div>
      <div class="settings-menu" id="settings-menu">
        <div class="settings-item" id="export-current"><i class="fas fa-file-export"></i> Export Chat Ini (JSON)</div>
        <div class="settings-item" id="export-all"><i class="fas fa-file-export"></i> Export Semua Chat (JSON)</div>
        <div class="settings-item" id="import-chats"><i class="fas fa-file-import"></i> Import Chat (JSON)</div>
        <div class="settings-item danger" id="clear-all"><i class="fas fa-trash-alt"></i> Hapus Semua Chat</div>
      </div>
    </div>

    <div id="main">
      <div id="chat-container"></div>
      <button id="back-to-bottom"><i class="fas fa-arrow-down"></i></button>
      <div id="input-area">
        <textarea id="prompt" placeholder="Ceritain apa aja ke Hildan AI..." autocomplete="off" rows="1"></textarea>
        <button id="send-btn"><i class="fas fa-paper-plane"></i> Kirim</button>
      </div>
    </div>
  </div>

  <input type="file" id="import-input" accept=".json" />

  <footer>
    Hildan AI • by <a href="https://github.com/hildan-anugrah" target="_blank">hildan-anugrah</a>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const chatContainer = document.getElementById('chat-container');
      const promptInput = document.getElementById('prompt');
      const sendBtn = document.getElementById('send-btn');
      const newChatBtn = document.getElementById('new-chat-btn');
      const historyList = document.getElementById('history-list');
      const sidebar = document.getElementById('sidebar');
      const menuBtn = document.getElementById('menu-btn');
      const sidebarClose = document.getElementById('sidebar-close');
      const overlay = document.getElementById('sidebar-overlay');
      const backToBottomBtn = document.getElementById('back-to-bottom');
      const settingsBtn = document.getElementById('settings-btn');
      const settingsMenu = document.getElementById('settings-menu');
      const exportCurrentBtn = document.getElementById('export-current');
      const exportAllBtn = document.getElementById('export-all');
      const importBtn = document.getElementById('import-chats');
      const clearAllBtn = document.getElementById('clear-all');
      const importInput = document.getElementById('import-input');

      const STORAGE_KEY = 'hildan_ai_chats';
      const MAX_CHATS = 50;
      const SCROLL_THRESHOLD = 150;

      let chats = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      let currentChatId = null;
      let isNearBottom = true;

      // Sidebar & Settings toggle
      function toggleSidebar() {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('open');
      }

      function closeSidebar() {
        sidebar.classList.remove('open');
        overlay.classList.remove('open');
      }

      settingsBtn.onclick = () => settingsMenu.classList.toggle('open');

      if (window.innerWidth <= 1023) {
        menuBtn.onclick = toggleSidebar;
        sidebarClose.onclick = closeSidebar;
        overlay.onclick = closeSidebar;
      }

      // Scroll handling
      function checkScrollPosition() {
        const scrollTop = chatContainer.scrollTop;
        const scrollHeight = chatContainer.scrollHeight;
        const clientHeight = chatContainer.clientHeight;

        if (scrollHeight - scrollTop - clientHeight < SCROLL_THRESHOLD) {
          isNearBottom = true;
          backToBottomBtn.classList.remove('show');
        } else {
          isNearBottom = false;
          backToBottomBtn.classList.add('show');
        }
      }

      function scrollToBottom(smooth = true) {
        if (smooth) {
          chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
        } else {
          chatContainer.scrollTop = chatContainer.scrollHeight;
        }
      }

      function appendMessageAndScroll() {
        if (isNearBottom) {
          setTimeout(() => scrollToBottom(true), 100);
        }
      }

      chatContainer.addEventListener('scroll', checkScrollPosition);
      backToBottomBtn.onclick = () => scrollToBottom(true);

      function saveChats() {
        if (chats.length > MAX_CHATS) chats = chats.slice(0, MAX_CHATS);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
        renderHistory();
      }

      function createNewChat() {
        const newChat = { id: Date.now(), title: "Chat Baru", messages: [] };
        chats.unshift(newChat);
        saveChats();
        loadChat(newChat.id);
      }

      function deleteChat(id) {
        if (!confirm("Hapus chat ini?")) return;
        chats = chats.filter(c => c.id !== id);
        if (currentChatId === id) {
          currentChatId = null;
          chatContainer.innerHTML = '';
          if (chats.length > 0) loadChat(chats[0].id);
          else createNewChat();
        }
        saveChats();
      }

      function deleteAllChats() {
        if (!confirm("Hapus SEMUA chat? Tindakan ini tidak bisa dibatalkan.")) return;
        chats = [];
        localStorage.removeItem(STORAGE_KEY);
        currentChatId = null;
        chatContainer.innerHTML = '';
        createNewChat();
      }

      // Export & Import
      function exportCurrentChat() {
        const chat = chats.find(c => c.id === currentChatId);
        if (!chat) return;

        const data = JSON.stringify(chat, null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `hildan-ai-chat-${chat.title?.replace(/[^a-z0-9]/gi, '-') || 'baru'}.json`;
        a.click();
        URL.revokeObjectURL(url);
      }

      function exportAllChats() {
        if (chats.length === 0) {
          alert("Belum ada chat untuk diexport.");
          return;
        }

        const data = JSON.stringify(chats, null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'hildan-ai-all-chats.json';
        a.click();
        URL.revokeObjectURL(url);
      }

      function importChats(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const imported = JSON.parse(e.target.result);

            if (Array.isArray(imported)) {
              // Import semua chat
              if (!confirm(`Import ${imported.length} chat? Ini akan menggantikan semua chat saat ini.`)) return;
              chats = imported;
              currentChatId = chats[0]?.id || null;
            } else {
              // Import satu chat
              imported.id = Date.now();
              chats.unshift(imported);
              currentChatId = imported.id;
            }

            saveChats();
            loadChat(currentChatId || chats[0].id);
            alert("Import berhasil!");
          } catch (err) {
            alert("File JSON tidak valid.");
          }
        };
        reader.readAsText(file);
        importInput.value = '';
      }

      function loadChat(id) {
        currentChatId = id;
        const chat = chats.find(c => c.id === id);
        if (!chat) return;

        chatContainer.innerHTML = '';

        if (chat.messages.length === 0) {
          const greeting = document.createElement('div');
          greeting.className = 'message bot';
          greeting.innerHTML = "Halo, gue Hildan AI. Cerita apa aja, gue siap dengerin dan bantu jawab.";
          chatContainer.appendChild(greeting);
        } else {
          chat.messages.forEach(msg => {
            if (msg.sender === 'user') tambahPesanUser(msg.text);
            else tambahPesanBot(msg.text);
          });
        }

        renderHistory();
        promptInput.focus();
        scrollToBottom(false);
        checkScrollPosition();

        if (window.innerWidth <= 1023) closeSidebar();
      }

      function renderHistory() {
        historyList.innerHTML = '';
        chats.forEach(chat => {
          const item = document.createElement('div');
          item.className = 'history-item' + (chat.id === currentChatId ? ' active' : '');

          const title = document.createElement('div');
          title.className = 'history-title';
          title.textContent = chat.title || "Chat Baru";

          const delBtn = document.createElement('button');
          delBtn.className = 'delete-btn';
          delBtn.innerHTML = '<i class="fas fa-trash"></i>';
          delBtn.onclick = (e) => {
            e.stopPropagation();
            deleteChat(chat.id);
          };

          item.appendChild(title);
          item.appendChild(delBtn);
          item.onclick = () => loadChat(chat.id);

          historyList.appendChild(item);
        });
      }

      function saveMessage(sender, text) {
        const chat = chats.find(c => c.id === currentChatId);
        if (chat) {
          chat.messages.push({ sender, text });
          if (sender === 'user' && chat.messages.filter(m => m.sender === 'user').length === 1) {
            chat.title = text.substring(0, 30) + (text.length > 30 ? '...' : '');
          }
          saveChats();
        }
      }

      function tambahPesanUser(text) {
        const div = document.createElement('div');
        div.className = 'message user';
        div.textContent = text;
        chatContainer.appendChild(div);
        appendMessageAndScroll();
      }

      function tambahPesanBot(text) {
        const div = document.createElement('div');
        div.className = 'message bot';

        const codeRegex = /```(\w+)?\n([\s\S]*?)```/g;
        let content = '';
        let lastIndex = 0;
        let match;

        while ((match = codeRegex.exec(text)) !== null) {
          if (match.index > lastIndex) {
            content += escapeHtml(text.slice(lastIndex, match.index)).replace(/\n/g, '<br>');
          }

          const lang = match[1] || 'javascript';
          const rawCode = match[2].trim();
          const highlighted = Prism.highlight(rawCode, Prism.languages[lang] || Prism.languages.javascript, lang);

          content += `
            <div class="code-block">
                <pre><code class="language-\( {lang}"> \){highlighted}</code></pre>
                <button class="copy-btn">Copy</button>
                <span class="copy-feedback">Copied!</span>
            </div>`;

          lastIndex = codeRegex.lastIndex;
        }

        if (lastIndex < text.length) {
          content += escapeHtml(text.slice(lastIndex)).replace(/\n/g, '<br>');
        }

        div.innerHTML = content || escapeHtml(text).replace(/\n/g, '<br>');
        chatContainer.appendChild(div);

        div.querySelectorAll('.copy-btn').forEach(btn => {
          btn.onclick = async () => {
            const code = btn.previousElementSibling.innerText;
            await navigator.clipboard.writeText(code);
            btn.nextElementSibling.style.opacity = '1';
            setTimeout(() => btn.nextElementSibling.style.opacity = '0', 1500);
          };
        });

        appendMessageAndScroll();
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      async function kirimPesan() {
        const text = promptInput.value.trim();
        if (!text || sendBtn.disabled) return;

        tambahPesanUser(text);
        saveMessage('user', text);

        promptInput.value = '';
        promptInput.style.height = 'auto';
        sendBtn.disabled = true;

        const typing = document.createElement('div');
        typing.className = 'message bot typing';
        typing.id = 'typing-indicator';
        typing.innerHTML = 'Sedang mengetik... <span></span><span></span><span></span>';
        chatContainer.appendChild(typing);
        appendMessageAndScroll();

        try {
          const res = await fetch('https://back-ai-delta.vercel.app/generate-text', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: text })
          });

          const data = await res.json();

          const indicator = document.getElementById('typing-indicator');
          if (indicator) indicator.remove();

          if (res.ok) {
            const jawaban = data.result;
            tambahPesanBot(jawaban);
            saveMessage('bot', jawaban);
          } else {
            tambahPesanBot("Error: " + (data.error || "Ada masalah di server."));
          }
        } catch (err) {
          const indicator = document.getElementById('typing-indicator');
          if (indicator) indicator.remove();
          tambahPesanBot("Waduh, koneksi putus atau server mati nih bro. Coba lagi ya.");
        } finally {
          sendBtn.disabled = false;
          promptInput.focus();
        }
      }

      promptInput.addEventListener('input', function () {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
      });

      promptInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 768) {
          e.preventDefault();
          kirimPesan();
        }
      });

      // Event listeners
      sendBtn.onclick = kirimPesan;
      newChatBtn.onclick = createNewChat;
      exportCurrentBtn.onclick = exportCurrentChat;
      exportAllBtn.onclick = exportAllChats;
      importBtn.onclick = () => importInput.click();
      importInput.onchange = importChats;
      clearAllBtn.onclick = deleteAllChats;

      if (chats.length === 0) createNewChat();
      else loadChat(chats[0].id);
    });
  </script>
</body>

</html>
